name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    name: Package & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Release Tarball
        run: |
          tar -czvf mcp-bassmachine-${{ github.ref_name }}.tar.gz bin/ src/ types/ bassmachine.toml LICENSE README.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: mcp-bassmachine-${{ github.ref_name }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
