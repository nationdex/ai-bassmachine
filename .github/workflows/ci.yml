name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-format:
    name: Lint, Format & Typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Lua & Luarocks
        uses: hishamhm/gh-actions-lua@56eba09993704b908cc3c7c2753e630d18cb9696 # master
        with:
          luaVersion: "5.4"

      - name: Setup Luarocks
        uses: hishamhm/gh-actions-luarocks@a7c25d32890e43a1f60d87fda1431b4973b8d295 # master

      - name: Setup Bun
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1

      - name: Install Stylua, Luacheck, and Teal
        run: |
          bun install -g @johnnymorganz/stylua-bin
          luarocks install luacheck
          luarocks install tl

      - name: Scan for committed secrets
        run: |
          bash scripts/secret-scan.sh

      - name: Check Formatting (Stylua)
        run: |
          stylua --check src tests

      - name: Lint Code (Luacheck)
        run: |
          luacheck src tests

      - name: Typecheck (Teal)
        run: |
          tl check types/ai_bassmachine.d.tl

  test-matrix:
    name: Test on Lua ${{ matrix.lua-version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        lua-version: ["5.1", "5.2", "5.3", "5.4", "luajit-openresty"]
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Lua
        uses: hishamhm/gh-actions-lua@56eba09993704b908cc3c7c2753e630d18cb9696 # master
        with:
          luaVersion: ${{ matrix.lua-version }}

      - name: Run Core Test Suite
        run: |
          lua tests/test_json.lua
          lua tests/test_toml.lua
          lua tests/test_history.lua
          lua tests/test_mcp_protocol.lua
          lua tests/test_env_manager.lua
          lua tests/test_skills_manager.lua
          lua tests/test_tui_mcp_config.lua
          lua tests/test_config_secrets.lua
          lua tests/test_ai_security.lua
          lua tests/test_ai_zenmux.lua
          lua tests/test_term_keys.lua
          lua tests/test_tui_enter_controls.lua
          lua tests/test_runner_stdio.lua
          lua tests/test_runner_preflight.lua
          lua tests/test_secrets.lua
          lua tests/test_tui_api_key.lua

      - name: Verify CLI Entrypoint
        run: |
          chmod +x bin/ai-bassmachine bin/mcp-bassmachine
          ./bin/ai-bassmachine list
          ./bin/ai-bassmachine check-config
          ./bin/ai-bassmachine skills

  test-windows:
    name: Test on Windows (${{ matrix.shell }})
    runs-on: windows-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Installer unit checks
        run: ./tests/test_install_ps1.ps1

      - name: Install pinned Lua with the installer's own code path
        run: |
          $env:MCP_BASSMACHINE_NOEXEC = '1'
          . ./install.ps1
          Remove-Item Env:MCP_BASSMACHINE_NOEXEC
          $lua = Install-BundledLua (Join-Path $env:RUNNER_TEMP 'lua\bin')
          if (-not $lua) { throw 'bundled Lua install failed' }
          "LUA_EXE=$lua" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run Windows test suite
        run: |
          foreach ($t in 'test_json','test_toml','test_history','test_mcp_protocol','test_env_manager','test_config_secrets','test_ai_security','test_term_keys','test_runner_stdio','test_runner_preflight','test_secrets','test_tui_api_key') {
            & $env:LUA_EXE "tests/$t.lua"
            if ($LASTEXITCODE -ne 0) { throw "$t failed" }
          }
